<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048- Gabriele Manuzzato</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="script/script.js"></script>
</head>
<body>
    <div class="feedback" id="sconfitta">
        <p id="sconfittaText">Hai perso<br> Il tuo punteggio è:</p> 
        <br>
        <button class="restart" onclick="restart()">Restart</button>
    </div>
    <div class="feedback" id="vittoria">
        <p id="vittoriaText">Hai vinto<br> Il tuo punteggio è:</p> <br>
        <button class="restart" onclick="restart()">Restart</button>
    </div>
    <div id="main">
        <h1 id="title"><strong>2048</strong></h1>
        <p id="scoreLine"><span id="score"></span></p>
        <p id="countdown">10:00</p>
        <div id="buttons">
            <button class="restart" onclick="restart()">Restart</button>
            <button class="restart" id="cancellaPiccoli" onclick="cancellaPiccoli()">Clear 2-4</button>
            <button class="restart" id="riordina" onclick="riordina()">Riordina</button>
        </div>
        
        

        <div id="game">
            <button class="verticalButton" id="topButton" onclick="move('up')">△</button>
            <div id="lateralButtons">
                <button class="lateralButton" id="leftButton" onclick="move('l')">◁</button>
                <table>
                
                    <tr>
                        <td id="00"></td>
                        <td id="01"></td>
                        <td id="02"></td>
                        <td id="03"></td>
                    </tr>
                    
                    <tr>
                        <td id="10"></td>
                        <td id="11"></td>
                        <td id="12"></td>
                        <td id="13"></td>
                    </tr>
                    
                    <tr>
                        <td id="20"></td>
                        <td id="21"></td>
                        <td id="22"></td>
                        <td id="23"></td>
                    </tr>
                    
                    <tr>
                        <td id="30"></td>
                        <td id="31"></td>
                        <td id="32"></td>
                        <td id="33"></td>
                    </tr>
    
                </table>
                <button class="lateralButton" id="rightButton" onclick="move('r')">▷</button>
            </div>
            <button class="verticalButton" id="downButton" onclick="move('down')">▽</button>
            
        </div>
    </div>
    
</body>
</html>
